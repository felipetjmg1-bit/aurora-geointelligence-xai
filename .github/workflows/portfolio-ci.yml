name: Aurora GeoIntelligence CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-geointelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run test suite
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: python -m pytest -q
